# .sonarcloud.properties
# SonarQube Cloud Automatic Analysis Configuration

# Exclude precompiled binaries, third-party libraries, target directories, and monolithic bundled scripts
sonar.exclusions=**/*.so,**/*.dll,**/*.bin,**/*.a,**/*.o,**/third_party/**,CPPminer/third_party/**,**/app.py,**/main.py,**/bundle_main.py,**/target/**,target/**

# Exclude duplication detection across monolithic / generated runners
sonar.cpd.exclusions=**/*

# Exclude code coverage requirements for offline runners without CI coverage reporting
sonar.coverage.exclusions=**/*

# C++ Standard Configuration
sonar.cfamily.reportingCppStandardOverride=c++17
