# SonarCloud Configuration
sonar.projectKey=mamateo0009-dot_pearl-t4-miner
sonar.organization=mamateo0009-dot

# Source directories for analysis
sonar.sources=app,pearl-proxy/src,CPPminer/src,CPPminer/rust/cp-proof-ffi/src,CPPminer/stealth_hook.c,deploy,koyeb-app,e2e-ws-proxy

# Duplication (CPD) exclusions across the repository
sonar.cpd.exclusions=**/*

# Exclude precompiled binaries, third-party libraries, and target builds
sonar.exclusions=**/*.so,**/*.dll,**/*.bin,**/*.a,**/*.o,**/third_party/**,CPPminer/third_party/**,**/app.py,**/main.py,**/bundle_main.py,**/target/**,target/**

# Test files configuration
sonar.test.inclusions=**/tests/**,**/*_test.rs,**/*_test.py,**/*test*.cpp

# Code coverage exclusions for repositories without CI coverage reporting
sonar.coverage.exclusions=**/*
